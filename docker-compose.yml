services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: speakbetter
      POSTGRES_USER: speakbetter
      POSTGRES_PASSWORD: speakbetter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakbetter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/speakbetter
      SPRING_DATASOURCE_USERNAME: speakbetter
      SPRING_DATASOURCE_PASSWORD: speakbetter
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      # Named volume, not a bind mount - recordings persist across
      # `docker compose down`/`up` as long as you don't add `-v`.
      - recordings-data:/app/data/recordings

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
  recordings-data:
