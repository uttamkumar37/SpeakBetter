name: speakbetter-v2

x-api-image: &api-image
  image: speakbetter-api:${IMAGE_TAG:-local}
  build:
    context: ./backend

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: speakbetter_v2
      POSTGRES_USER: speakbetter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-v2.sh and load .env.v2 first}
    volumes:
      - v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U speakbetter -d speakbetter_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1

  migrate:
    <<: *api-image
    entrypoint: [/app/migrate]
    environment:
      DATABASE_URL: postgres://speakbetter:${POSTGRES_PASSWORD}@postgres:5432/speakbetter_v2?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://speakbetter:${POSTGRES_PASSWORD}@postgres:5432/speakbetter_v2?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
    volumes:
      - v2-recordings-data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/api/v2/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  frontend:
    image: speakbetter-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  v2-postgres-data:
  v2-recordings-data:
