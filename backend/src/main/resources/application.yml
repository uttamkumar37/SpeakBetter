spring:
  application:
    name: communication-practice
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/speakbetter}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:uttamkumar}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# Railway/Render inject the port to bind via $PORT - defaults to 8080 locally.
server:
  port: ${PORT:8080}

app:
  recordings:
    storage-path: ./data/recordings
    retention-days: 30
    max-upload-size-bytes: 524288000
    cleanup-cron: "0 0 3 * * *"
    allowed-mime-types: video/webm,video/mp4,video/ogg
  cors:
    # Comma-separated list of origins allowed to call the API. Add the deployed
    # frontend's real domain(s) here via this env var in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    transcription-enabled: ${AI_TRANSCRIPTION_ENABLED:false}
    transcription-provider: ${AI_TRANSCRIPTION_PROVIDER:}
    transcription-model: ${AI_TRANSCRIPTION_MODEL:}
    analysis-enabled: ${AI_ANALYSIS_ENABLED:false}
    analysis-provider: ${AI_ANALYSIS_PROVIDER:}
    analysis-model: ${AI_ANALYSIS_MODEL:}

logging:
  level:
    com.speakbetter.practice: INFO
